[package]
edition = "2024"
name = "firmware"
version = "0.1.0"
license = "MIT"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
heapless = "0.8"
panic-halt = "0.2"
pioemu-protocol = { path = "../protocol" }
usb-device = "0.3"
usbd-serial = "0.2"

# If you're not going to use a Board Support Package you'll need these:
rp235x-hal = { version = "0.3", features = [
    "rt",
    "critical-section-impl",
    "binary-info",
] }
